<div class="min-h-screen bg-[var(--color-canvas)] text-[var(--color-text-primary)] font-sans" (click)="closeProfileMenu()">
  <!-- Mobile Overlay -->
  <div *ngIf="sidebarOpen"
       class="fixed inset-0 bg-black/40 z-40 lg:hidden"
       (click)="closeSidebar()"></div>

  <!-- Sidebar -->
  <div class="fixed inset-y-0 left-0 z-50 transform transition-transform duration-300 lg:translate-x-0"
       [class.translate-x-0]="sidebarOpen"
       [class.-translate-x-full]="!sidebarOpen">
    <app-sidebar [isCollapsed]="isCollapsed" (navClicked)="closeSidebar()" (collapseToggled)="onCollapseToggled($event)"></app-sidebar>
  </div>

  <!-- Main Content -->
  <div class="transition-all duration-300" [ngClass]="{'lg:ml-64': !isCollapsed, 'lg:ml-20': isCollapsed}">
    <!-- Top Bar -->
    <header class="h-16 bg-white border-b border-[var(--color-border)] flex items-center justify-between px-4 sm:px-6 sticky top-0 z-30">
      <div class="flex items-center gap-4">
        <button (click)="toggleSidebar()" class="p-2 text-[var(--color-text-muted)] hover:text-[var(--color-text-primary)] hover:bg-[var(--color-surface-alt)] rounded-lg transition-colors">
          <svg lucideMenu class="w-5 h-5"></svg>
        </button>
        <div class="text-sm font-semibold text-[var(--color-text-secondary)] hidden sm:block">
          {{ isStaff ? 'Staff Portal' : 'Customer Portal' }}
        </div>
      </div>

      <div class="flex items-center gap-3">
        <app-notification-bell></app-notification-bell>

        <div class="relative">
          <button (click)="toggleProfileMenu($event)" class="flex items-center gap-2 pl-1.5 pr-2.5 py-1.5 rounded-xl hover:bg-[var(--color-surface-alt)] transition-colors">
            <div class="w-8 h-8 rounded-full flex items-center justify-center bg-[var(--color-brand-600)] flex-shrink-0">
              <span class="text-white text-xs font-bold">{{ userInitials }}</span>
            </div>
            <div class="hidden sm:flex flex-col items-start leading-tight">
              <span class="text-xs font-semibold text-[var(--color-text-primary)] max-w-[140px] truncate">{{ currentUser?.name || currentUser?.email }}</span>
              <span class="text-[10px] text-[var(--color-text-muted)] uppercase tracking-wide">{{ currentUser?.role?.replace('_',' ') }}</span>
            </div>
            <svg lucideChevronDown class="w-3.5 h-3.5 text-[var(--color-text-muted)] hidden sm:block"></svg>
          </button>

          <div *ngIf="profileMenuOpen" class="absolute right-0 mt-2 w-64 app-card py-2 z-50">
            <div class="px-4 py-3 border-b border-[var(--color-border)]">
              <p class="text-sm font-semibold text-[var(--color-text-primary)] truncate">{{ currentUser?.email }}</p>
              <p class="text-xs text-[var(--color-brand-700)] font-semibold mt-0.5 uppercase tracking-wide">{{ currentUser?.role }}</p>
            </div>
            <a (click)="logout()" class="flex items-center px-4 py-2.5 text-sm text-[var(--color-danger-600)] hover:bg-[var(--color-danger-50)] cursor-pointer transition-colors">
              <svg lucideLogOut class="w-4 h-4 mr-3"></svg>
              Sign Out
            </a>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <main>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
