<div class="p-4 sm:p-6 lg:p-8">
  <div class="max-w-4xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex items-center">
      <a routerLink="/staff/districts" class="mr-4 p-2 app-btn-secondary app-btn !px-2.5 !py-2.5">
        <svg lucideArrowLeft class="w-5 h-5"></svg>
      </a>
      <div>
        <h1 class="text-2xl font-bold text-[var(--color-text-primary)]">{{ isEditMode ? 'Edit District' : 'Add New District' }}</h1>
        <p class="text-[var(--color-text-secondary)] mt-1 text-sm">Fill in the details below to {{ isEditMode ? 'update' : 'create' }} a district.</p>
      </div>
    </div>

    <div class="app-card p-8">

      <div *ngIf="isLoading && isEditMode" class="py-12 flex justify-center">
        <svg class="animate-spin h-8 w-8 text-[var(--color-brand-600)]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </div>

      <form *ngIf="!isLoading || !isEditMode" [formGroup]="districtForm" (ngSubmit)="onSubmit()" class="space-y-8">
        <div>
          <h3 class="text-xs font-semibold uppercase tracking-wide text-[var(--color-text-muted)] mb-4">District Details</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-1.5">District Name</label>
              <input type="text" formControlName="name" class="app-input">
              <p *ngIf="districtForm.get('name')?.invalid && districtForm.get('name')?.touched" class="mt-1 text-xs text-[var(--color-danger-600)]">District name is required</p>
            </div>
            <div>
              <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-1.5">Division</label>
              <select formControlName="divisionId" class="app-input">
                <option value="">Select Division</option>
                <option *ngFor="let d of divisions" [value]="d.id">{{ d.name }}</option>
              </select>
              <p *ngIf="districtForm.get('divisionId')?.invalid && districtForm.get('divisionId')?.touched" class="mt-1 text-xs text-[var(--color-danger-600)]">Division is required</p>
            </div>
          </div>
        </div>

        <div class="pt-4 flex justify-end gap-4">
          <a routerLink="/staff/districts" class="app-btn app-btn-secondary">
            Cancel
          </a>
          <button type="submit" [disabled]="districtForm.invalid || isLoading" class="app-btn app-btn-primary">
            <svg *ngIf="isLoading" class="animate-spin -ml-1 mr-1 h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            {{ isEditMode ? 'Update District' : 'Create District' }}
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
