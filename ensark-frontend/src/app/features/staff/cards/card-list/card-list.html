<div class="p-6 space-y-6">

  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <h1 class="text-2xl font-bold text-[var(--color-text-primary)]">Cards</h1>
      <p class="text-sm text-[var(--color-text-muted)] mt-0.5">Manage all issued bank cards.</p>
    </div>
    <a routerLink="/staff/cards/new" class="app-btn app-btn-primary">
      <svg lucidePlus class="w-4 h-4"></svg>
      Apply Card
    </a>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    <app-stat-card label="Total Cards" [value]="cards.length" color="brand" [loading]="isLoading">
      <svg icon lucideCreditCard></svg>
    </app-stat-card>
    <app-stat-card label="Active" [value]="activeCount" color="success" [loading]="isLoading">
      <svg icon lucideCircleCheck></svg>
    </app-stat-card>
    <app-stat-card label="Blocked / Disabled" [value]="inactiveCount" color="danger" [loading]="isLoading">
      <svg icon lucideBan></svg>
    </app-stat-card>
    <app-stat-card label="Pending" [value]="pendingCount" color="warning" [loading]="isLoading">
      <svg icon lucideClock></svg>
    </app-stat-card>
  </div>

  <div class="app-table-shell">
    <div class="p-6 border-b border-[var(--color-border)]">
      <div class="relative w-full md:w-96">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg lucideSearch class="h-4 w-4 text-[var(--color-text-muted)]"></svg>
        </div>
        <input type="text" [(ngModel)]="searchTerm" (input)="onSearch()" class="app-input pl-10" placeholder="Search by card number, holder, account...">
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="text-xs uppercase tracking-wide text-[var(--color-text-muted)] bg-[var(--color-surface-alt)] sticky top-0">
          <tr>
            <th scope="col" class="px-6 py-3 font-semibold">Card Number</th>
            <th scope="col" class="px-6 py-3 font-semibold">Holder</th>
            <th scope="col" class="px-6 py-3 font-semibold">Account</th>
            <th scope="col" class="px-6 py-3 font-semibold">Network</th>
            <th scope="col" class="px-6 py-3 font-semibold">Type</th>
            <th scope="col" class="px-6 py-3 font-semibold">Status</th>
            <th scope="col" class="px-6 py-3 font-semibold">Expiry</th>
            <th scope="col" class="px-6 py-3 font-semibold text-right">Actions</th>
          </tr>
        </thead>
        <tbody *ngIf="!isLoading">
          <tr *ngFor="let card of filteredCards" class="border-b border-[var(--color-border)] last:border-0 hover:bg-[var(--color-surface-alt)] transition-colors">
            <td class="px-6 py-4 font-mono text-xs font-medium text-[var(--color-text-primary)]">{{ card.cardNumber }}</td>
            <td class="px-6 py-4 text-xs text-[var(--color-text-secondary)]">{{ card.cardHolderName }}</td>
            <td class="px-6 py-4 font-mono text-xs text-[var(--color-text-muted)]">{{ card.accountNumber }}</td>
            <td class="px-6 py-4 text-xs text-[var(--color-text-secondary)]">{{ card.cardNetwork }}</td>
            <td class="px-6 py-4 text-xs text-[var(--color-text-secondary)]">{{ card.cardType }}</td>
            <td class="px-6 py-4">
              <app-badge [label]="card.status" [color]="statusColor(card.status)"></app-badge>
            </td>
            <td class="px-6 py-4 text-xs text-[var(--color-text-muted)]">{{ card.expiryDate | date:'MM/yy' }}</td>
            <td class="px-6 py-4 text-right">
              <a [routerLink]="['/staff/cards', card.cardId]" class="text-[var(--color-brand-600)] hover:text-[var(--color-brand-700)] text-xs font-semibold hover:underline transition-colors">View</a>
            </td>
          </tr>
          <tr *ngIf="filteredCards.length === 0">
            <td colspan="8" class="px-6 py-10 text-center text-sm text-[var(--color-text-muted)]">No cards found.</td>
          </tr>
        </tbody>
        <tbody *ngIf="isLoading">
          <tr *ngFor="let i of [1,2,3,4,5]">
            <td colspan="8" class="px-6 py-4">
              <div class="h-8 bg-[var(--color-surface-alt)] rounded animate-pulse"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
