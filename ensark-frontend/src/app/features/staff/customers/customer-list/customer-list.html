<div class="p-4 sm:p-6 lg:p-8 space-y-6">

  <div>
    <h1 class="text-2xl font-bold text-[var(--color-text-primary)]">Customer Management</h1>
    <p class="text-[var(--color-text-secondary)] mt-1 text-sm">View and manage bank customers.</p>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
    <app-stat-card label="Total Customers" [value]="customers.length" color="brand" [loading]="isLoading">
      <svg icon lucideUsers class="w-5 h-5"></svg>
    </app-stat-card>
    <app-stat-card label="KYC Verified" [value]="verifiedCount" color="success" [loading]="isLoading">
      <svg icon lucideShieldCheck class="w-5 h-5"></svg>
    </app-stat-card>
    <app-stat-card label="KYC Pending" [value]="pendingCount" color="warning" [loading]="isLoading">
      <svg icon lucideShieldAlert class="w-5 h-5"></svg>
    </app-stat-card>
    <app-stat-card label="Active Accounts" [value]="activeCount" color="info" [loading]="isLoading">
      <svg icon lucideUserCheck class="w-5 h-5"></svg>
    </app-stat-card>
  </div>

  <div class="app-table-shell overflow-hidden">
    <div class="p-4 border-b border-[var(--color-border)]">
      <div class="relative w-full md:w-96">
        <svg lucideSearch class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--color-text-muted)]"></svg>
        <input type="text" [(ngModel)]="searchTerm" (input)="onSearch()" class="app-input pl-10" placeholder="Search by name, email, phone...">
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="text-xs text-[var(--color-text-muted)] uppercase tracking-wide bg-[var(--color-surface-alt)] sticky top-0">
          <tr>
            <th scope="col" class="px-6 py-3 font-medium">Customer</th>
            <th scope="col" class="px-6 py-3 font-medium">Contact</th>
            <th scope="col" class="px-6 py-3 font-medium">Occupation</th>
            <th scope="col" class="px-6 py-3 font-medium">KYC Status</th>
            <th scope="col" class="px-6 py-3 font-medium">Status</th>
            <th scope="col" class="px-6 py-3 font-medium text-right">Actions</th>
          </tr>
        </thead>
        <tbody *ngIf="!isLoading" class="divide-y divide-[var(--color-border)]">
          <tr *ngFor="let customer of filteredCustomers" class="hover:bg-[var(--color-surface-alt)] transition-colors">
            <td class="px-6 py-4">
              <div class="flex items-center">
                <div class="w-9 h-9 rounded-full bg-[var(--color-brand-50)] flex items-center justify-center text-[var(--color-brand-600)] text-xs font-semibold mr-3 overflow-hidden flex-shrink-0">
                  <img *ngIf="customer.profile" [src]="getProfileUrl(customer.profile)" class="w-full h-full object-cover" alt="">
                  <span *ngIf="!customer.profile">{{ customer.name?.charAt(0) }}</span>
                </div>
                <div class="min-w-0">
                  <div class="font-medium text-[var(--color-text-primary)] truncate">{{ customer.name }}</div>
                  <div class="text-xs text-[var(--color-text-muted)]">ID: {{ customer.id }}</div>
                </div>
              </div>
            </td>
            <td class="px-6 py-4">
              <div class="text-[var(--color-text-primary)] text-xs">{{ customer.email }}</div>
              <div class="text-xs text-[var(--color-text-muted)] mt-0.5">{{ customer.phone }}</div>
            </td>
            <td class="px-6 py-4">
              <span class="text-[var(--color-text-secondary)] text-xs">{{ customer.occupation }}</span>
            </td>
            <td class="px-6 py-4">
              <app-badge [label]="customer.kycStatus || 'NOT SUBMITTED'" [color]="kycBadgeColor(customer.kycStatus)"></app-badge>
            </td>
            <td class="px-6 py-4">
              <app-badge [label]="customer.active ? 'Active' : 'Inactive'" [color]="customer.active ? 'success' : 'neutral'"></app-badge>
            </td>
            <td class="px-6 py-4 text-right">
              <a [routerLink]="['/staff/customers', customer.id]" class="text-[var(--color-brand-600)] hover:text-[var(--color-brand-700)] flex items-center justify-end gap-1 text-xs font-medium">
                <svg lucideEye class="w-3.5 h-3.5"></svg>
                View
              </a>
            </td>
          </tr>
          <tr *ngIf="filteredCustomers.length === 0">
            <td colspan="6" class="px-6 py-12 text-center text-[var(--color-text-muted)] text-sm">No customers found.</td>
          </tr>
        </tbody>
        <tbody *ngIf="isLoading">
          <tr *ngFor="let i of [1,2,3,4,5]">
            <td colspan="6" class="px-6 py-4">
              <div class="h-10 bg-[var(--color-border)] rounded animate-pulse"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
