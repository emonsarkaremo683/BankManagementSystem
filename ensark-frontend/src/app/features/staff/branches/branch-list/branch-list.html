<div class="p-4 sm:p-6 lg:p-8 space-y-6">

  <!-- Header -->
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <h1 class="text-2xl font-bold text-[var(--color-text-primary)]">Branch Management</h1>
      <p class="text-[var(--color-text-secondary)] mt-1 text-sm">Manage bank branches, routing numbers, and locations.</p>
    </div>
    <a routerLink="/staff/branches/new" class="app-btn app-btn-primary">
      <svg lucidePlus class="w-4 h-4"></svg>
      Add Branch
    </a>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
    <app-stat-card label="Total Branches" [value]="branches.length" color="brand" [loading]="isLoading">
      <svg icon lucideBuilding2 class="w-5 h-5"></svg>
    </app-stat-card>
    <app-stat-card label="Active" [value]="activeCount" color="success" [loading]="isLoading">
      <svg icon lucideCircleCheck class="w-5 h-5"></svg>
    </app-stat-card>
    <app-stat-card label="Closed" [value]="closedCount" color="info" [loading]="isLoading">
      <svg icon lucideBuilding class="w-5 h-5"></svg>
    </app-stat-card>
    <app-stat-card label="Agent Banks" [value]="agentBankCount" color="warning" [loading]="isLoading">
      <svg icon lucideLandmark class="w-5 h-5"></svg>
    </app-stat-card>
  </div>

  <!-- Data Table -->
  <div class="app-table-shell overflow-hidden">
    <div class="p-4 border-b border-[var(--color-border)]">
      <div class="relative w-full md:w-96">
        <svg lucideSearch class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-[var(--color-text-muted)]"></svg>
        <input type="text" [(ngModel)]="searchTerm" (input)="onSearch()"
               class="app-input pl-10"
               placeholder="Search by name, code, email, phone...">
      </div>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left text-sm">
        <thead class="text-xs text-[var(--color-text-muted)] uppercase tracking-wide bg-[var(--color-surface-alt)] sticky top-0">
          <tr>
            <th scope="col" class="px-6 py-3 font-medium">Branch</th>
            <th scope="col" class="px-6 py-3 font-medium">Routing / Code</th>
            <th scope="col" class="px-6 py-3 font-medium">Contact</th>
            <th scope="col" class="px-6 py-3 font-medium">Type</th>
            <th scope="col" class="px-6 py-3 font-medium">Status</th>
            <th scope="col" class="px-6 py-3 font-medium text-right">Actions</th>
          </tr>
        </thead>
        <tbody *ngIf="!isLoading" class="divide-y divide-[var(--color-border)]">
          <tr *ngFor="let branch of filteredBranches" class="hover:bg-[var(--color-surface-alt)] transition-colors">
            <td class="px-6 py-4">
              <div class="flex items-center">
                <div class="h-10 w-10 flex-shrink-0 rounded-lg bg-[var(--color-brand-50)] border border-[var(--color-border)] flex items-center justify-center text-[var(--color-brand-600)]">
                  <svg lucideBuilding2 class="w-5 h-5"></svg>
                </div>
                <div class="ml-3 min-w-0">
                  <div class="font-medium text-[var(--color-text-primary)] truncate">{{ branch.name }}</div>
                  <div class="text-xs text-[var(--color-text-muted)] mt-0.5 truncate">{{ branch.address }}</div>
                </div>
              </div>
            </td>
            <td class="px-6 py-4">
              <div class="text-[var(--color-text-primary)] font-mono text-xs">{{ branch.routingNumber }}</div>
              <div class="text-xs text-[var(--color-text-muted)] mt-0.5 font-mono">{{ branch.branchCode }}</div>
            </td>
            <td class="px-6 py-4">
              <div class="text-[var(--color-text-primary)]">{{ branch.email }}</div>
              <div class="text-xs text-[var(--color-text-muted)] mt-0.5">{{ branch.phoneNumber }}</div>
            </td>
            <td class="px-6 py-4">
              <app-badge [label]="branch.type.replace('_', ' ')" [color]="typeBadgeColor(branch.type)"></app-badge>
            </td>
            <td class="px-6 py-4">
              <app-badge [label]="branch.status" [color]="statusBadgeColor(branch.status)"></app-badge>
            </td>
            <td class="px-6 py-4 text-right">
              <div class="flex items-center justify-end gap-4">
                <button *ngIf="branch.status === 'ACTIVE'" (click)="deactivate(branch)"
                        class="text-[var(--color-danger-600)] hover:text-[var(--color-danger-700)] flex items-center gap-1 text-xs font-medium">
                  <svg lucideBan class="w-3.5 h-3.5"></svg>
                  Close
                </button>
                <a [routerLink]="['/staff/branches/edit', branch.id]" class="text-[var(--color-brand-600)] hover:text-[var(--color-brand-700)] flex items-center gap-1 text-xs font-medium">
                  <svg lucidePencil class="w-3.5 h-3.5"></svg>
                  Edit
                </a>
              </div>
            </td>
          </tr>
          <tr *ngIf="filteredBranches.length === 0">
            <td colspan="6" class="px-6 py-12 text-center text-[var(--color-text-muted)] text-sm">
              No branches found.
            </td>
          </tr>
        </tbody>
        <tbody *ngIf="isLoading">
          <tr *ngFor="let i of [1,2,3,4,5]">
            <td colspan="6" class="px-6 py-4">
              <div class="h-10 bg-[var(--color-border)] rounded animate-pulse"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
