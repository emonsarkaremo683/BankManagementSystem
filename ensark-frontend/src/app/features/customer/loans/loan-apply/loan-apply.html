<div class="pt-8 pb-20 w-full px-4 sm:px-6 lg:px-8">
  <div class="max-w-2xl mx-auto">

    <div class="mb-6">
      <a routerLink="/customer/loans" class="text-[var(--color-text-muted)] hover:text-[var(--color-text-primary)] text-sm flex items-center transition-colors">
        <svg lucideArrowLeft class="w-4 h-4 mr-1.5"></svg>
        Back to My Loans
      </a>
    </div>

    <div class="app-card overflow-hidden">
      <div class="p-6 border-b border-[var(--color-border)]">
        <h1 class="text-2xl font-bold text-[var(--color-text-primary)]">Apply for Loan</h1>
        <p class="text-[var(--color-text-secondary)] mt-1 text-sm">Fill in the details to apply for a new loan.</p>
      </div>

      <form [formGroup]="loanForm" (ngSubmit)="onSubmit()" class="p-6 space-y-6">
        <!-- Loan Details -->
        <div>
          <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-2">Account</label>
          <select formControlName="accountId" class="app-input">
            <option value="">Select account</option>
            <option *ngFor="let acc of accounts" [ngValue]="acc.id">{{ acc.accountNumber }} - {{ acc.accountType }}</option>
          </select>
          <div *ngIf="loanForm.get('accountId')?.touched && loanForm.get('accountId')?.errors?.['required']" class="text-[var(--color-danger-600)] text-xs mt-1">Account is required</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-2">Principal Amount</label>
            <input type="number" formControlName="principalAmount" class="app-input" placeholder="Min 1000">
            <div *ngIf="loanForm.get('principalAmount')?.touched && loanForm.get('principalAmount')?.errors?.['required']" class="text-[var(--color-danger-600)] text-xs mt-1">Amount is required</div>
            <div *ngIf="loanForm.get('principalAmount')?.touched && loanForm.get('principalAmount')?.errors?.['min']" class="text-[var(--color-danger-600)] text-xs mt-1">Minimum 1000</div>
          </div>

          <div>
            <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-2">Interest Rate (% p.a.)</label>
            <input type="number" formControlName="annualInterestRate" class="app-input" placeholder="e.g. 12">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-2">Tenure (months)</label>
          <input type="number" formControlName="tenureMonths" class="app-input" placeholder="e.g. 12">
        </div>

        <!-- Guarantor Details -->
        <div class="pt-4 border-t border-[var(--color-border)]">
          <h3 class="text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-4">Guarantor Details</h3>
          <div formGroupName="guarantor" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-2">Name</label>
                <input type="text" formControlName="name" class="app-input" placeholder="Guarantor name">
              </div>
              <div>
                <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-2">Phone</label>
                <input type="text" formControlName="phone" class="app-input" placeholder="Phone number">
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-2">Address</label>
              <input type="text" formControlName="address" class="app-input" placeholder="Full address">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-2">NID Number</label>
                <input type="text" formControlName="nidNumber" class="app-input" placeholder="NID number">
              </div>
              <div>
                <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-2">Relation</label>
                <input type="text" formControlName="relation" class="app-input" placeholder="e.g. Father, Brother">
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-2">Guarantor Photo (optional)</label>
              <label class="flex items-center justify-center gap-2 border border-dashed border-[var(--color-border-strong)] rounded-[var(--radius-input)] py-4 cursor-pointer hover:bg-[var(--color-surface-alt)] transition-colors text-sm text-[var(--color-text-muted)]">
                <svg lucideCamera class="w-4 h-4"></svg>
                <span>{{ guarantorPhoto ? guarantorPhoto.name : 'Upload guarantor photo' }}</span>
                <input type="file" accept="image/*" class="hidden" (change)="onGuarantorPhotoSelected($event)">
              </label>
              <div *ngIf="guarantorPhoto" class="flex items-center justify-between mt-2 px-3 py-2 bg-[var(--color-surface-alt)] rounded-[var(--radius-input)] border border-[var(--color-border)]">
                <span class="text-xs text-[var(--color-text-primary)] truncate">{{ guarantorPhoto.name }}</span>
                <button type="button" (click)="removeGuarantorPhoto()" class="text-[var(--color-text-muted)] hover:text-[var(--color-danger-600)]">
                  <svg lucideX class="w-3.5 h-3.5"></svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Supporting Documents -->
        <div class="pt-4 border-t border-[var(--color-border)]">
          <h3 class="text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-4">Supporting Documents (optional)</h3>
          <label class="flex items-center justify-center gap-2 border border-dashed border-[var(--color-border-strong)] rounded-[var(--radius-input)] py-4 cursor-pointer hover:bg-[var(--color-surface-alt)] transition-colors text-sm text-[var(--color-text-muted)]">
            <svg lucideUpload class="w-4 h-4"></svg>
            <span>Upload documents (income proof, ID, etc.)</span>
            <input type="file" multiple class="hidden" (change)="onDocumentsSelected($event)">
          </label>
          <div *ngIf="documents.length > 0" class="space-y-2 mt-3">
            <div *ngFor="let doc of documents; let i = index" class="flex items-center justify-between px-3 py-2 bg-[var(--color-surface-alt)] rounded-[var(--radius-input)] border border-[var(--color-border)]">
              <div class="flex items-center gap-2 min-w-0">
                <svg lucideFileText class="w-4 h-4 text-[var(--color-text-muted)] flex-shrink-0"></svg>
                <span class="text-xs text-[var(--color-text-primary)] truncate">{{ doc.name }}</span>
              </div>
              <button type="button" (click)="removeDocument(i)" class="text-[var(--color-text-muted)] hover:text-[var(--color-danger-600)] flex-shrink-0">
                <svg lucideX class="w-3.5 h-3.5"></svg>
              </button>
            </div>
          </div>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t border-[var(--color-border)]">
          <a routerLink="/customer/loans" class="app-btn app-btn-secondary">Cancel</a>
          <button type="submit" [disabled]="isLoading" class="app-btn app-btn-primary">
            {{ isLoading ? 'Submitting...' : 'Submit Application' }}
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
