<div class="p-6 space-y-6 max-w-2xl mx-auto">

  <div class="flex items-center gap-4">
    <a routerLink="/customer/cards" class="app-btn app-btn-secondary !h-10 !w-10 !px-0">
      <svg lucideArrowLeft class="w-4 h-4"></svg>
    </a>
    <div>
      <h1 class="text-2xl font-bold text-[var(--color-text-primary)]">Apply for a Card</h1>
      <p class="text-sm text-[var(--color-text-muted)] mt-0.5">Choose your account, card preferences, and set a PIN.</p>
    </div>
  </div>

  <div class="app-card p-8">
    <form [formGroup]="cardForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <div>
        <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">Account</label>
        <div class="grid grid-cols-1 gap-2">
          <button *ngFor="let acc of accounts" type="button"
                  (click)="selectAccount(acc.id)"
                  class="w-full px-4 py-3 border rounded-[var(--radius-input)] text-left text-sm transition-all"
                  [ngClass]="cardForm.get('accountId')?.value == acc.id
                    ? 'border-[var(--color-brand-500)] bg-[var(--color-brand-50)] text-[var(--color-brand-700)]'
                    : 'border-[var(--color-border-strong)] bg-[var(--color-surface)] text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-alt)]'">
            <span class="font-medium">{{ acc.accountNumber }}</span>
            <span class="ml-2 text-xs opacity-70">{{ acc.accountType }}</span>
          </button>
        </div>
        <div *ngIf="cardForm.get('accountId')?.touched && cardForm.get('accountId')?.errors?.['required']" class="text-[var(--color-danger-600)] text-xs mt-1">Account is required</div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">Card Network</label>
          <div class="grid grid-cols-2 gap-2">
            <button *ngFor="let n of cardNetworks" type="button"
                    (click)="selectNetwork(n)"
                    class="px-4 py-3 border rounded-[var(--radius-input)] text-sm font-medium text-center transition-all"
                    [ngClass]="cardForm.get('cardNetwork')?.value === n
                      ? 'border-[var(--color-brand-500)] bg-[var(--color-brand-50)] text-[var(--color-brand-700)]'
                      : 'border-[var(--color-border-strong)] bg-[var(--color-surface)] text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-alt)]'">
              {{ n }}
            </button>
          </div>
          <div *ngIf="cardForm.get('cardNetwork')?.touched && cardForm.get('cardNetwork')?.errors?.['required']" class="text-[var(--color-danger-600)] text-xs mt-1">Network is required</div>
        </div>

        <div>
          <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">Card Type</label>
          <div class="grid grid-cols-2 gap-2">
            <button *ngFor="let t of cardTypes" type="button"
                    (click)="selectType(t)"
                    class="px-4 py-3 border rounded-[var(--radius-input)] text-sm font-medium text-center transition-all"
                    [ngClass]="cardForm.get('cardType')?.value === t
                      ? 'border-[var(--color-brand-500)] bg-[var(--color-brand-50)] text-[var(--color-brand-700)]'
                      : 'border-[var(--color-border-strong)] bg-[var(--color-surface)] text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-alt)]'">
              {{ t }}
            </button>
          </div>
          <div *ngIf="cardForm.get('cardType')?.touched && cardForm.get('cardType')?.errors?.['required']" class="text-[var(--color-danger-600)] text-xs mt-1">Type is required</div>
        </div>
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">PIN (4-6 digits)</label>
        <input type="password" formControlName="pin" maxlength="6" class="app-input" placeholder="Enter PIN">
        <div *ngIf="cardForm.get('pin')?.touched && cardForm.get('pin')?.errors?.['required']" class="text-[var(--color-danger-600)] text-xs mt-1">PIN is required</div>
        <div *ngIf="cardForm.get('pin')?.touched && cardForm.get('pin')?.errors?.['minlength']" class="text-[var(--color-danger-600)] text-xs mt-1">PIN must be at least 4 digits</div>
      </div>

      <div class="flex items-center gap-6">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" formControlName="isInternationalEnabled" class="w-4 h-4 rounded border-[var(--color-border-strong)] text-[var(--color-brand-600)] focus:ring-[var(--color-brand-500)]">
          <span class="text-sm text-[var(--color-text-secondary)]">International Transactions</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" formControlName="isOnlineTransactionEnabled" class="w-4 h-4 rounded border-[var(--color-border-strong)] text-[var(--color-brand-600)] focus:ring-[var(--color-brand-500)]">
          <span class="text-sm text-[var(--color-text-secondary)]">Online Transactions</span>
        </label>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-[var(--color-border)]">
        <a routerLink="/customer/cards" class="app-btn app-btn-secondary">Cancel</a>
        <button type="submit" [disabled]="isLoading" class="app-btn app-btn-primary">
          <svg lucideCreditCard class="w-4 h-4"></svg>
          {{ isLoading ? 'Applying...' : 'Apply for Card' }}
        </button>
      </div>
    </form>
  </div>

</div>
