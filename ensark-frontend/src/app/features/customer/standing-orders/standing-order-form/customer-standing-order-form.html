<div class="w-full px-4 sm:px-6 lg:px-8 pt-8 pb-20">
  <div class="max-w-2xl mx-auto space-y-6">

    <a routerLink="/customer/standing-orders" class="inline-flex items-center gap-1.5 text-sm text-[var(--color-text-muted)] hover:text-[var(--color-text-primary)] transition-colors">
      <svg lucideArrowLeft class="w-4 h-4"></svg>
      Back to My Standing Orders
    </a>

    <div class="app-card overflow-hidden">
      <div class="p-6 border-b border-[var(--color-border)]">
        <h1 class="text-2xl font-bold text-[var(--color-text-primary)]">New Standing Order</h1>
        <p class="text-sm text-[var(--color-text-muted)] mt-1">Set up a recurring transfer between accounts.</p>
      </div>

      <form [formGroup]="orderForm" (ngSubmit)="onSubmit()" class="p-6 space-y-6">
        <div>
          <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">Source Account</label>
          <select formControlName="sourceAccountId" class="app-input">
            <option value="">Select source account</option>
            <option *ngFor="let acc of accounts" [ngValue]="acc.id">{{ acc.accountNumber }} - {{ acc.accountType }} ({{ acc.availableBalance | number:'1.2-2' }})</option>
          </select>
          <div *ngIf="orderForm.get('sourceAccountId')?.touched && orderForm.get('sourceAccountId')?.errors?.['required']" class="text-[var(--color-danger-600)] text-xs mt-1.5">Source account is required</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">Target Account Number</label>
            <input type="text" formControlName="targetAccountNumber" class="app-input" placeholder="Account number">
          </div>

          <div>
            <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">Target Account Name</label>
            <input type="text" formControlName="targetAccountName" class="app-input" placeholder="Account holder name">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">Amount</label>
            <input type="number" formControlName="amount" class="app-input" placeholder="Min 0.01">
          </div>

          <div>
            <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">Frequency</label>
            <select formControlName="frequency" class="app-input">
              <option value="">Select frequency</option>
              <option *ngFor="let f of frequencies" [value]="f">{{ f }}</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">Start Date</label>
            <input type="date" formControlName="startDate" class="app-input">
          </div>

          <div>
            <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">End Date (Optional)</label>
            <input type="date" formControlName="endDate" class="app-input">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">Max Executions (0 = unlimited)</label>
            <input type="number" formControlName="maxExecutions" min="0" class="app-input" placeholder="0 for unlimited">
          </div>

          <div>
            <label class="block text-xs uppercase tracking-wide text-[var(--color-text-muted)] mb-2">Description</label>
            <input type="text" formControlName="description" class="app-input" placeholder="Optional description">
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-[var(--color-border)]">
          <a routerLink="/customer/standing-orders" class="app-btn app-btn-secondary">Cancel</a>
          <button type="submit" [disabled]="isLoading" class="app-btn app-btn-primary">
            {{ isLoading ? 'Creating...' : 'Create Standing Order' }}
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
