<div class="p-6 space-y-6 max-w-2xl mx-auto">

  <a routerLink="/customer/cheques" class="text-[var(--color-text-muted)] hover:text-[var(--color-text-primary)] text-sm flex items-center transition-colors">
    <svg lucideArrowLeft class="w-4 h-4 mr-1"></svg>
    Back to My Cheque Books
  </a>

  <div class="app-card overflow-hidden">
    <div class="p-6 border-b border-[var(--color-border)]">
      <h1 class="text-2xl font-bold text-[var(--color-text-primary)]">Apply for Cheque Book</h1>
      <p class="text-sm text-[var(--color-text-muted)] mt-1">Request a new cheque book for your account.</p>
    </div>

    <form [formGroup]="chequeForm" (ngSubmit)="onSubmit()" class="p-6 space-y-6">
      <div>
        <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-2">Account</label>
        <select formControlName="accountId" class="app-input">
          <option value="">Select account</option>
          <option *ngFor="let acc of accounts" [ngValue]="acc.id">{{ acc.accountNumber }} - {{ acc.accountType }}</option>
        </select>
        <div *ngIf="chequeForm.get('accountId')?.touched && chequeForm.get('accountId')?.errors?.['required']" class="text-[var(--color-danger-600)] text-xs mt-1">Account is required</div>
      </div>

      <div>
        <label class="block text-sm font-medium text-[var(--color-text-secondary)] mb-2">Number of Leaves</label>
        <select formControlName="numberOfLeaves" class="app-input">
          <option *ngFor="let opt of leafOptions" [ngValue]="opt">{{ opt }} leaves</option>
        </select>
        <p class="text-xs text-[var(--color-text-muted)] mt-1">Fee: BDT {{ feeAmount }}.00</p>
      </div>

      <div class="flex justify-end gap-3 pt-4 border-t border-[var(--color-border)]">
        <a routerLink="/customer/cheques" class="app-btn app-btn-secondary">Cancel</a>
        <button type="submit" [disabled]="isLoading" class="app-btn app-btn-primary">
          {{ isLoading ? 'Submitting...' : 'Submit Application' }}
        </button>
      </div>
    </form>
  </div>

</div>
