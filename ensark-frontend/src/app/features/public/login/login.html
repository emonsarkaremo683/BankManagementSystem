<div class="flex-1 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-slate-950 relative">
  
  <div class="absolute top-0 left-0 w-full h-full overflow-hidden pointer-events-none z-0">
    <div class="absolute top-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-emerald-500/8 blur-[120px]"></div>
    <div class="absolute bottom-[-10%] left-[-5%] w-[35%] h-[35%] rounded-full bg-teal-500/8 blur-[100px]"></div>
  </div>

  <div class="max-w-md w-full relative z-10 animate-fade-in-up">
    
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-2 mb-6">
        <div class="w-10 h-10 bg-gradient-to-br from-emerald-400 to-teal-500 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <span class="text-xl font-bold text-white tracking-tight">Ensark Bank</span>
      </a>
      <h2 class="text-3xl font-extrabold text-white tracking-tight">Welcome back</h2>
      <p class="mt-2 text-sm text-slate-400">
        Don't have an account?
        <a routerLink="/register" class="font-medium text-emerald-400 hover:text-emerald-300 transition-colors">Open one today</a>
      </p>
    </div>

    <div class="bg-slate-900/60 backdrop-blur-xl rounded-2xl border border-slate-800 p-6 sm:p-8">

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 flex items-center gap-3 mb-6">
        <div class="w-8 h-8 rounded-lg bg-red-500/10 flex items-center justify-center flex-shrink-0">
          <svg class="w-4 h-4 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        </div>
        <span class="text-sm text-red-300">{{ errorMessage }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5 uppercase tracking-wider">Email Address</label>
          <input type="email" formControlName="email"
            class="block w-full px-4 py-3 rounded-xl bg-slate-800/80 border text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-sm"
            [class.border-red-500/50]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
            [class.border-slate-700]="!(loginForm.get('email')?.touched && loginForm.get('email')?.invalid)"
            placeholder="Enter your email">
          <p *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-red-400 text-xs mt-1.5">Valid email is required</p>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
            <a routerLink="/forgot-password" class="text-xs font-medium text-emerald-400 hover:text-emerald-300 transition-colors">Forgot password?</a>
          </div>
          <input type="password" formControlName="password"
            class="block w-full px-4 py-3 rounded-xl bg-slate-800/80 border text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-sm"
            [class.border-red-500/50]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
            [class.border-slate-700]="!(loginForm.get('password')?.touched && loginForm.get('password')?.invalid)"
            placeholder="Enter your password">
          <p *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-red-400 text-xs mt-1.5">Password is required</p>
        </div>

        <label class="flex items-center gap-3 cursor-pointer group">
          <div class="relative">
            <input type="checkbox" formControlName="rememberMe" class="peer sr-only">
            <div class="w-5 h-5 rounded border-2 border-slate-600 peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all flex items-center justify-center">
              <svg class="w-3 h-3 text-white opacity-0 peer-checked:opacity-100" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>
            </div>
          </div>
          <span class="text-sm text-slate-400 group-hover:text-slate-300 transition-colors">Remember me for 30 days</span>
        </label>

        <button type="submit" [disabled]="isLoading"
          class="w-full py-3.5 rounded-xl text-sm font-bold bg-emerald-500 text-slate-950 hover:bg-emerald-400 shadow-lg shadow-emerald-500/25 hover:shadow-emerald-500/40 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          <svg *ngIf="isLoading" class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ isLoading ? 'Authenticating...' : 'Sign In' }}
        </button>
      </form>
    </div>
  </div>
</div>
