<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
  <div class="w-full max-w-md p-8 bg-white/10 backdrop-blur-xl rounded-2xl border border-white/20 shadow-2xl">
    <h2 class="text-2xl font-bold text-white text-center mb-2">Two-Factor Authentication</h2>
    <p class="text-gray-300 text-center text-sm mb-6">Enter the 6-digit code from your authenticator app</p>

    @if (errorMessage) {
      <div class="mb-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-300 text-sm text-center">
        {{ errorMessage }}
      </div>
    }

    <form [formGroup]="mfaForm" (ngSubmit)="onSubmit()">
      <div class="mb-6">
        <input
          type="text"
          formControlName="code"
          placeholder="000000"
          maxlength="6"
          class="w-full px-4 py-3 text-center text-2xl tracking-[0.5em] bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        @if (mfaForm.get('code')?.touched && mfaForm.get('code')?.invalid) {
          <p class="mt-2 text-red-400 text-xs">Please enter a valid 6-digit code</p>
        }
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-600/50 text-white font-semibold rounded-lg transition-colors"
      >
        @if (isLoading) {
          <span class="animate-pulse">Verifying...</span>
        } @else {
          Verify
        }
      </button>
    </form>

    <p class="mt-6 text-center text-gray-400 text-sm">
      <a routerLink="/login" class="text-blue-400 hover:text-blue-300">Back to Login</a>
    </p>
  </div>
</div>
