  <!--
    sockjs-client (used by websocket.service.ts) references the Node global
    `global` at module load time. Angular's dev-server pre-bundles it with
    Vite's own esbuild pass, which isn't reachable via angular.json's
    "define"/"polyfills" options — but a plain synchronous inline script
    always runs before any deferred `type="module"` script, regardless of
    bundler internals, so this is the one place guaranteed to run first.
  -->
  <script>window.global = window;</script>
