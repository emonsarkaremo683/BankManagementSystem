spring.application.name=bank-management-system

# Database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/elitebank?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Server
server.port=8085

# File Uploads (configurable via UPLOAD_DIR env var)
image.upload.dir=${UPLOAD_DIR:D:/ensarkbank/uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email (set SMTP_USERNAME and SMTP_PASSWORD env vars for production, or paste your new app password without spaces)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:emonsarkar.emo683@gmail.com}
spring.mail.password=${SMTP_PASSWORD:qhpwzsceieozhiuq}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT
# No default on purpose: JWT_SECRET must be supplied by the environment.
# Spring has no bash-style ":?" required-property syntax, so an unset variable
# here makes the context fail to start instead of silently using a placeholder.
# JwtUtil additionally validates length/entropy at startup.
jwt.secret=EmonSarkarIsNothingWithoutAi866214
jwt.expiration=900000
jwt.emp-expiration =  28800000
jwt.verification-expiration=3600000
jwt.reset-expiration=900000
jwt.refresh-expiration=900000

# Frontend
# Single source of truth for the allowed browser origin (CORS, WebSocket, email links).
app.frontend-url=${FRONTEND_URL:http://localhost:4200}

spring.security.user.name=admin
spring.security.user.password=1234

# Credit Billing Configuration
credit.billing.minimum-payment-percentage=0.02
credit.billing.minimum-payment-floor=25
credit.billing.grace-period-days=21

